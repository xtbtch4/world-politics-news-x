name: Publish world news to Telegram

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - publish_world_news
  push:
    branches:
      - main
    paths:
      - "data/run-now.txt"
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: world-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GEMINI_API_KEY_6: ${{ secrets.GEMINI_API_KEY_6 }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      GEMINI_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      DISABLE_GEMINI: "false"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: "gpt-5.6-luna"
      TELEGRAM_CHAT_ID: "@xtbtch"
      MAX_AGE_DAYS: "7"
      MAX_POSTS_PER_RUN: "2"
      MIN_IMPORTANCE_SCORE: "5"
      DRY_RUN: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and publish news
        run: python safe_entrypoint.py

      - name: Save publication history
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "No history changes"
            exit 0
          fi

          cp data/posted.json /tmp/local-posted.json
          git restore data/posted.json
          git pull --rebase origin main

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          remote_path = Path("data/posted.json")
          local_path = Path("/tmp/local-posted.json")
          remote = json.loads(remote_path.read_text(encoding="utf-8"))
          local = json.loads(local_path.read_text(encoding="utf-8"))

          def merged_values(key):
              return list(dict.fromkeys(remote.get(key, []) + local.get(key, [])))[-2000:]

          merged = {
              "posted_urls": merged_values("posted_urls"),
              "posted_fingerprints": merged_values("posted_fingerprints"),
              "posted_event_keys": merged_values("posted_event_keys"),
              "updated_at": datetime.now(timezone.utc).isoformat(),
          }
          remote_path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          if git diff --quiet -- data/posted.json; then
            echo "History already contains these publications"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git commit -m "Update publication history"
          git push
