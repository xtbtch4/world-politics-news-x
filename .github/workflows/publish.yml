name: Publish world news to Telegram

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/run-now.txt"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: world-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: "gemini-3.5-flash"
      GEMINI_FALLBACK_MODEL: "gemini-3.1-flash-lite"
      TELEGRAM_CHAT_ID: "@xtbtch"
      MAX_AGE_DAYS: "7"
      MAX_POSTS_PER_RUN: "2"
      MIN_IMPORTANCE_SCORE: "5"
      DRY_RUN: ${{ github.event_name == 'push' && 'true' || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and publish news
        run: python bot.py

      - name: Save publication history
        run: |
          if git diff --quiet -- data/posted.json; then
            echo "No history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git commit -m "Update publication history"
          git pull --rebase origin main
          git push
